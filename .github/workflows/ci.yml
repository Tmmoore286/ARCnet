name: ARCnet CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run Tests
        run: swift test -v --parallel

  lint:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift Format
        run: |
          if command -v swiftformat &> /dev/null; then
            swiftformat --lint App Tests || echo "SwiftFormat not configured, skipping"
          else
            echo "SwiftFormat not installed, skipping lint"
          fi
