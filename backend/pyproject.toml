[project]
name = "arcnet-ml"
version = "0.1.0"
description = "ML forecasting pipeline for ARCnet decision support system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Timothy Moore", email = "tmmoore286@gmail.com"}
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "shap>=0.43",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "httpx>=0.25",
    "python-multipart>=0.0.6",
    "duckdb>=0.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "ipykernel>=6.27",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
arcnet-ml = "arcnet_ml.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
